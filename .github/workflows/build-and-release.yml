name: Build and release desktop apps

# Runs in phantom-interview/phantom-release (public). The private source repo is checked out
# read-only, built, and only compiled outputs are attached to releases. There are two channels:
#
#   staging -> rolling tag desktop-staging, immutable tags vX.Y.Z-staging, its own latest.json.
#              It never touches desktop-latest, so a beta build can never become the public
#              "latest" download.
#   prod    -> rolling tag desktop-latest, immutable tags vX.Y.Z, and the latest.json that the
#              backend and dashboard read. prod never moves backwards in version.
#
# Versioning: every run mints exactly one immutable release on its channel. The patch number is
# derived from the newest release on that channel: same MAJOR.MINOR continues the count, a new
# MAJOR.MINOR resets it to 0. staging and prod keep separate series (staging starts at 1.0.0).
#
# Partial releases: each platform uploads its own asset inside its own job, and the publish job
# records one download pointer per platform in latest.json. A failed platform therefore does not
# block the others: its pointer keeps the previous working build until a later run publishes it.
# Use "Re-run failed jobs": it re-runs the failed build plus this dependent publish job, and the
# version/tag for the run is pinned in the release-plan artifact, so a re-run reuses the same tag
# instead of minting a new version.

on:
  repository_dispatch:
    types: [desktop-release]
  workflow_dispatch:
    inputs:
      channel:
        description: "staging (beta; never updates desktop-latest) or prod (the public latest)."
        required: false
        type: choice
        options:
          - staging
          - prod
        default: staging
      major_minor:
        description: "MAJOR.MINOR only (for example 1.0 or 2.3). Leave empty to keep the last prefix."
        required: false
        type: string
        default: ""
      source_ref:
        description: "Branch, tag, or SHA of the private source to build. Leave empty for the private repo's default branch."
        required: false
        type: string
        default: ""
      build_windows:
        description: "Build Phantom-Windows-x64-<version>.zip."
        required: false
        type: boolean
        default: true
      build_macos:
        description: "Build Phantom-macOS-<version>.zip."
        required: false
        type: boolean
        default: true
      build_android:
        description: "Build and sign Phantom-Android-<version>.apk."
        required: false
        type: boolean
        default: true

permissions:
  contents: write
  actions: read

# One run at a time per channel. Publishing rewrites release assets and latest.json, so two
# concurrent runs in the same channel would race on them (read-modify-write of latest.json).
# staging and prod use different groups: a beta build never waits behind, or cancels, a
# production release. cancel-in-progress stays false because cancelling mid-publish can leave a
# half-updated pointer set.
concurrency:
  group: desktop-release-${{ github.event.inputs.channel || github.event.client_payload.channel || 'staging' }}
  cancel-in-progress: false

env:
  PRIVATE_REPOSITORY: tapas-patra/Phantom
  # Used only when the private repo's default branch cannot be read from the API. The real
  # default branch is resolved at run time, so a rename upstream needs no edit here.
  PRIVATE_SOURCE_REF_FALLBACK: master

jobs:
  # ---------------------------------------------------------------------------------------------
  # Plan: resolve channel, platforms, source revision, and the version this run owns.
  # ---------------------------------------------------------------------------------------------
  version:
    name: Plan release
    runs-on: ubuntu-latest
    outputs:
      channel: ${{ steps.plan.outputs.channel }}
      rolling_tag: ${{ steps.plan.outputs.rolling_tag }}
      version: ${{ steps.plan.outputs.version }}
      tag: ${{ steps.plan.outputs.tag }}
      source_ref: ${{ steps.plan.outputs.source_ref }}
      source_sha: ${{ steps.plan.outputs.source_sha }}
      build_windows: ${{ steps.plan.outputs.build_windows }}
      build_macos: ${{ steps.plan.outputs.build_macos }}
      build_android: ${{ steps.plan.outputs.build_android }}
    steps:
      - name: Look for a plan pinned by an earlier attempt of this run
        id: existing
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: release-plan
          path: ${{ runner.temp }}/existing-plan

      - name: Compute the release plan
        id: plan
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PRIVATE_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
          INPUT_CHANNEL: ${{ github.event.inputs.channel }}
          DISPATCH_CHANNEL: ${{ github.event.client_payload.channel }}
          INPUT_MAJOR_MINOR: ${{ github.event.inputs.major_minor }}
          DISPATCH_MAJOR_MINOR: ${{ github.event.client_payload.major_minor }}
          INPUT_SOURCE_REF: ${{ github.event.inputs.source_ref }}
          DISPATCH_SOURCE_REF: ${{ github.event.client_payload.source_ref }}
          DISPATCH_SOURCE_SHA: ${{ github.event.client_payload.source_sha }}
          INPUT_BUILD_WINDOWS: ${{ github.event.inputs.build_windows }}
          INPUT_BUILD_MACOS: ${{ github.event.inputs.build_macos }}
          INPUT_BUILD_ANDROID: ${{ github.event.inputs.build_android }}
          DISPATCH_BUILD_WINDOWS: ${{ github.event.client_payload.build_windows }}
          DISPATCH_BUILD_MACOS: ${{ github.event.client_payload.build_macos }}
          DISPATCH_BUILD_ANDROID: ${{ github.event.client_payload.build_android }}
        run: |
          set -euo pipefail

          # --- channel ---------------------------------------------------------------------
          # Absent means staging: a dispatch caller that does not know about channels keeps
          # building beta artifacts and can never move the public latest pointer.
          CHANNEL_IN="$(printf '%s' "${INPUT_CHANNEL:-${DISPATCH_CHANNEL:-}}" | tr '[:upper:]' '[:lower:]' | tr -d '[:space:]')"
          case "$CHANNEL_IN" in
            ''|staging|beta) CHANNEL=staging ;;
            prod|production|stable) CHANNEL=prod ;;
            *) echo "channel must be staging or prod, got '${CHANNEL_IN}'." >&2; exit 1 ;;
          esac
          case "$CHANNEL" in
            staging) ROLLING_TAG=desktop-staging; TAG_SUFFIX="-staging" ;;
            prod)    ROLLING_TAG=desktop-latest;  TAG_SUFFIX="" ;;
          esac

          # --- which platforms to build ----------------------------------------------------
          # Each platform is its own boolean so any combination can be selected. A value that is
          # absent (a repository_dispatch caller that does not know these keys) means "build it".
          read_bool() {
            local label="$1" raw
            raw="$(printf '%s' "${2:-}" | tr '[:upper:]' '[:lower:]' | tr -d '[:space:]')"
            case "$raw" in
              ''|true|1|yes|on) echo true ;;
              false|0|no|off) echo false ;;
              *) echo "$label must be true or false, got '${2:-}'." >&2; return 1 ;;
            esac
          }

          BUILD_WINDOWS="$(read_bool build_windows "${INPUT_BUILD_WINDOWS:-${DISPATCH_BUILD_WINDOWS:-}}")"
          BUILD_MACOS="$(read_bool build_macos "${INPUT_BUILD_MACOS:-${DISPATCH_BUILD_MACOS:-}}")"
          BUILD_ANDROID="$(read_bool build_android "${INPUT_BUILD_ANDROID:-${DISPATCH_BUILD_ANDROID:-}}")"

          SELECTED=""
          if [ "$BUILD_WINDOWS" = "true" ]; then SELECTED="${SELECTED:+$SELECTED,}windows"; fi
          if [ "$BUILD_MACOS" = "true" ]; then SELECTED="${SELECTED:+$SELECTED,}macos"; fi
          if [ "$BUILD_ANDROID" = "true" ]; then SELECTED="${SELECTED:+$SELECTED,}android"; fi
          if [ -z "$SELECTED" ]; then
            echo "Nothing to build: enable at least one of build_windows, build_macos, or build_android." >&2
            exit 1
          fi
          echo "Platforms: $SELECTED"

          # --- which private branch/tag/SHA to build --------------------------------------
          REF="$(printf '%s' "${INPUT_SOURCE_REF:-${DISPATCH_SOURCE_REF:-}}" | tr -d '[:space:]')"
          if [ -n "$REF" ]; then
            if printf '%s' "$REF" | grep -q '\.\.' || printf '%s' "$REF" | grep -Eq '^-'; then
              echo "source_ref is not a valid branch, tag, or SHA." >&2
              exit 1
            fi
          else
            REF="$(GH_TOKEN="$PRIVATE_TOKEN" gh api "repos/$PRIVATE_REPOSITORY" --jq '.default_branch' 2>/dev/null || true)"
          fi
          REF="${REF:-$PRIVATE_SOURCE_REF_FALLBACK}"
          # Record the commit that is actually built, so release notes and latest.json do not
          # claim a different revision when a branch other than the trigger branch is built.
          RESOLVED_SHA="$(GH_TOKEN="$PRIVATE_TOKEN" gh api -X GET "repos/$PRIVATE_REPOSITORY/commits" \
            -f "sha=$REF" -f "per_page=1" --jq '.[0].sha' 2>/dev/null || true)"
          SOURCE_SHA="${RESOLVED_SHA:-${DISPATCH_SOURCE_SHA:-$GITHUB_SHA}}"

          PLAN_DIR="$RUNNER_TEMP/plan-out"
          mkdir -p "$PLAN_DIR"
          PLAN="$PLAN_DIR/release-plan.json"
          EXISTING_PLAN="$RUNNER_TEMP/existing-plan/release-plan.json"

          if [ -f "$EXISTING_PLAN" ]; then
            # A re-run of this same run (run id is stable across attempts). Reuse the pinned
            # plan so the rebuild lands on the same tag instead of minting a new version.
            cp "$EXISTING_PLAN" "$PLAN"
            echo "Reusing the release plan pinned by an earlier attempt of run $GITHUB_RUN_ID."
          else
            INPUT_MM="$(printf '%s' "${INPUT_MAJOR_MINOR:-${DISPATCH_MAJOR_MINOR:-}}" | tr -d '[:space:]')"
            if [ -n "$INPUT_MM" ] && ! printf '%s' "$INPUT_MM" | grep -Eq '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'; then
              echo "major_minor must be MAJOR.MINOR, for example 1.0 or 2.3" >&2
              exit 1
            fi

            # Every immutable release on the channel is one build; the newest one is the
            # baseline for the next patch number and the guard against prod downgrades.
            if [ "$CHANNEL" = "staging" ]; then
              CHANNEL_RE='^v[0-9]+\.[0-9]+\.[0-9]+-staging$'
            else
              CHANNEL_RE='^v[0-9]+\.[0-9]+\.[0-9]+$'
            fi
            RELEASES="$(gh release list --repo "$GITHUB_REPOSITORY" --limit 300 --json tagName,createdAt \
              --jq '.[] | [.createdAt, .tagName] | @tsv' | LC_ALL=C sort -r)"
            CHANNEL_TAGS="$(printf '%s\n' "$RELEASES" | cut -f2 | grep -E "$CHANNEL_RE" || true)"
            LAST_TAG="$(printf '%s\n' "$CHANNEL_TAGS" | head -1)"
            LAST_VERSION=""
            if [ -n "$LAST_TAG" ]; then
              LAST_VERSION="$(printf '%s' "$LAST_TAG" | sed -e 's/^v//' -e 's/-staging$//')"
            fi
            MAX_VERSION="$(printf '%s\n' "$CHANNEL_TAGS" | sed -e 's/^v//' -e 's/-staging$//' \
              | sed '/^$/d' | LC_ALL=C sort -V | tail -1)"

            LAST_MAJOR=0; LAST_MINOR=0; LAST_PATCH=0
            if [ -n "$LAST_VERSION" ]; then
              LAST_MAJOR="${LAST_VERSION%%.*}"
              REST="${LAST_VERSION#*.}"
              LAST_MINOR="${REST%%.*}"
              LAST_PATCH="${REST#*.}"
            fi

            if [ -n "$INPUT_MM" ]; then
              PREFIX="$INPUT_MM"
            elif [ -n "$LAST_VERSION" ]; then
              PREFIX="${LAST_MAJOR}.${LAST_MINOR}"
            else
              # Fresh channel: staging starts at 1.0.0. prod with no releases at all also starts
              # at 1.0.0; when old (pre-channel) tags exist they are picked up above instead.
              PREFIX="1.0"
            fi
            PREFIX_MAJOR="${PREFIX%%.*}"
            PREFIX_MINOR="${PREFIX#*.}"

            if [ "$CHANNEL" = "prod" ] && [ -n "$MAX_VERSION" ]; then
              MAX_PREFIX="${MAX_VERSION%.*}"
              MAX_MAJOR="${MAX_PREFIX%%.*}"
              MAX_MINOR="${MAX_PREFIX#*.}"
              if [ "$PREFIX_MAJOR" -lt "$MAX_MAJOR" ] || \
                 { [ "$PREFIX_MAJOR" -eq "$MAX_MAJOR" ] && [ "$PREFIX_MINOR" -lt "$MAX_MINOR" ]; }; then
                echo "prod does not allow downgrades: $PREFIX is behind the current prod line $MAX_PREFIX (highest release $MAX_VERSION). Pick a higher MAJOR.MINOR." >&2
                exit 1
              fi
            fi

            # Same MAJOR.MINOR continues the count; a new MAJOR.MINOR starts at 0. leaving the
            # prefix empty therefore keeps counting, and passing a new prefix resets it.
            PATCH=0
            if [ -n "$LAST_VERSION" ] && [ "$PREFIX" = "${LAST_MAJOR}.${LAST_MINOR}" ]; then
              PATCH=$((LAST_PATCH + 1))
            fi

            # Tags are immutable, so skip over any version that already exists (for example
            # when a previous run created its release but never published assets).
            CANDIDATE_TAG=""
            for _ in $(seq 1 500); do
              CANDIDATE="${PREFIX}.${PATCH}${TAG_SUFFIX}"
              CANDIDATE_TAG="v${CANDIDATE}"
              if ! gh release view "$CANDIDATE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
                break
              fi
              CANDIDATE_TAG=""
              PATCH=$((PATCH + 1))
            done
            if [ -z "$CANDIDATE_TAG" ]; then
              echo "Could not find a free version tag for ${PREFIX} on the ${CHANNEL} channel." >&2
              exit 1
            fi

            export PLAN_CHANNEL="$CHANNEL"
            export PLAN_ROLLING="$ROLLING_TAG"
            export PLAN_VERSION="${PREFIX}.${PATCH}${TAG_SUFFIX}"
            export PLAN_TAG="$CANDIDATE_TAG"
            export PLAN_REF="$REF"
            export PLAN_SHA="$SOURCE_SHA"
            export PLAN_PLATFORMS="$SELECTED"
            export PLAN_RUN_ID="$GITHUB_RUN_ID"
            export PLAN_RUN_NUMBER="$GITHUB_RUN_NUMBER"
            export PLAN_RUN_URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

          python3 - "$PLAN" <<'PY'
          import json
          import os
          import sys

          plan = {
              "channel": os.environ["PLAN_CHANNEL"],
              "rollingTag": os.environ["PLAN_ROLLING"],
              "version": os.environ["PLAN_VERSION"],
              "tag": os.environ["PLAN_TAG"],
              "sourceRef": os.environ["PLAN_REF"],
              "sourceSha": os.environ["PLAN_SHA"],
              "platforms": [p for p in os.environ["PLAN_PLATFORMS"].split(",") if p],
              "runId": int(os.environ["PLAN_RUN_ID"]),
              "runNumber": int(os.environ["PLAN_RUN_NUMBER"]),
              # Android needs an integer that only ever grows across BOTH channels. The
              # workflow run number is shared by staging and prod and never repeats, so it
              # stays monotonic without a second ledger to race on.
              "versionCode": int(os.environ["PLAN_RUN_NUMBER"]),
              "runUrl": os.environ["PLAN_RUN_URL"],
          }
          with open(sys.argv[1], "w", encoding="utf-8", newline="\n") as handle:
              handle.write(json.dumps(plan, indent=2) + "\n")
          PY
          fi

          {
            echo "channel=$(jq -r .channel "$PLAN")"
            echo "rolling_tag=$(jq -r .rollingTag "$PLAN")"
            echo "version=$(jq -r .version "$PLAN")"
            echo "tag=$(jq -r .tag "$PLAN")"
            echo "source_ref=$(jq -r .sourceRef "$PLAN")"
            echo "source_sha=$(jq -r .sourceSha "$PLAN")"
            echo "build_windows=$(jq -r '.platforms | index("windows") != null' "$PLAN")"
            echo "build_macos=$(jq -r '.platforms | index("macos") != null' "$PLAN")"
            echo "build_android=$(jq -r '.platforms | index("android") != null' "$PLAN")"
          } >> "$GITHUB_OUTPUT"

          {
            echo "### Desktop release plan"
            echo ""
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Channel | $(jq -r .channel "$PLAN") |"
            echo "| Version | $(jq -r .version "$PLAN") |"
            echo "| Tag | $(jq -r .tag "$PLAN") |"
            echo "| Rolling tag | $(jq -r .rollingTag "$PLAN") |"
            echo "| Platforms | $(jq -r '.platforms | join(", ")' "$PLAN") |"
            echo "| Source | $(jq -r .sourceRef "$PLAN") ($(jq -r .sourceSha "$PLAN")) |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Pin the plan for re-runs
        uses: actions/upload-artifact@v4
        with:
          name: release-plan
          path: ${{ runner.temp }}/plan-out/release-plan.json
          if-no-files-found: error
          retention-days: 30
          # A "Re-run all jobs" re-executes this job and must replace the pinned copy, not fail
          # on a name collision with the previous attempt.
          overwrite: true

      - name: Ensure the rolling and versioned releases exist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CHANNEL: ${{ steps.plan.outputs.channel }}
          ROLLING_TAG: ${{ steps.plan.outputs.rolling_tag }}
          VERSION: ${{ steps.plan.outputs.version }}
          TAG: ${{ steps.plan.outputs.tag }}
          SOURCE_REF: ${{ steps.plan.outputs.source_ref }}
          SOURCE_SHA: ${{ steps.plan.outputs.source_sha }}
        run: |
          set -euo pipefail
          PRERELEASE=""
          if [ "$CHANNEL" = "staging" ]; then PRERELEASE="--prerelease"; fi

          ROLLING_TITLE="Phantom Desktop (latest)"
          if [ "$CHANNEL" = "staging" ]; then ROLLING_TITLE="Phantom Desktop (staging)"; fi
          if ! gh release view "$ROLLING_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$ROLLING_TAG" --repo "$GITHUB_REPOSITORY" --title "$ROLLING_TITLE" \
              --notes "Download pointers for the $CHANNEL channel. latest.json is the machine-readable source of truth." $PRERELEASE
          fi

          # The immutable release is created before any build so every job has a stable upload
          # target even when another platform fails. publish replaces the notes at the end.
          BODY="$(printf 'Phantom Desktop %s (unsigned) from %s (%s).\n\nchannel: %s\nversion: %s\nrun: %s\nref: %s\nsha: %s\nplatforms: %s\n' \
            "$VERSION" "$SOURCE_REF" "$SOURCE_SHA" "$CHANNEL" "$VERSION" "$GITHUB_RUN_ID" "$SOURCE_REF" "$SOURCE_SHA" \
            "$(jq -r '.platforms | join(",")' "$RUNNER_TEMP/plan-out/release-plan.json")")"
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "Phantom Desktop $VERSION" \
              --notes "$BODY" $PRERELEASE
          fi
          echo "Releases ready: $ROLLING_TAG and $TAG ($CHANNEL channel)."

  # ---------------------------------------------------------------------------------------------
  # Builds. Each job owns exactly one asset and uploads it to both its versioned tag and the
  # channel's rolling tag as soon as it succeeds; nothing here waits for a sibling platform.
  # ---------------------------------------------------------------------------------------------
  windows:
    name: Windows
    needs: [version]
    # A cleared checkbox leaves Windows out of the plan and skips every build step. `!= 'false'`
    # also keeps the job eligible when a re-run of only the failed jobs leaves needs outputs
    # empty; the pinned plan still makes the final decision.
    if: ${{ needs.version.outputs.build_windows != 'false' }}
    runs-on: windows-latest
    steps:
      - name: Download the release plan
        uses: actions/download-artifact@v4
        with:
          name: release-plan
          path: ${{ runner.temp }}/release-plan

      - name: Read the release plan
        id: plan
        shell: pwsh
        run: |
          $planPath = Join-Path $env:RUNNER_TEMP "release-plan/release-plan.json"
          if (-not (Test-Path $planPath)) {
            Write-Error "The release plan artifact is missing; the version job did not finish."
            exit 1
          }
          $plan = Get-Content $planPath -Raw | ConvertFrom-Json
          $enabled = (@($plan.platforms) -contains "windows")
          @(
            "enabled=$($enabled.ToString().ToLowerInvariant())"
            "version=$($plan.version)"
            "tag=$($plan.tag)"
            "rolling_tag=$($plan.rollingTag)"
            "source_ref=$($plan.sourceRef)"
            "source_sha=$($plan.sourceSha)"
          ) | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Check out private source (read-only)
        if: steps.plan.outputs.enabled == 'true'
        uses: actions/checkout@v4
        with:
          repository: ${{ env.PRIVATE_REPOSITORY }}
          ref: ${{ steps.plan.outputs.source_ref }}
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          persist-credentials: false

      - name: Set up .NET
        if: steps.plan.outputs.enabled == 'true'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Build, package, and upload Windows app
        if: steps.plan.outputs.enabled == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PHANTOM_PRODUCT_VERSION: ${{ steps.plan.outputs.version }}
          VERSION_TAG: ${{ steps.plan.outputs.tag }}
          ROLLING_TAG: ${{ steps.plan.outputs.rolling_tag }}
          ASSET_NAME: Phantom-Windows-x64-${{ steps.plan.outputs.version }}.zip
        run: |
          $out = Join-Path $env:RUNNER_TEMP "windows-out"
          $log = Join-Path $env:RUNNER_TEMP "windows-build.log"
          dotnet publish phantom-windows-app/SecureOverlay.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -p:PhantomProductVersion=$env:PHANTOM_PRODUCT_VERSION -p:IncludeSourceRevisionInInformationalVersion=false -o $out *> $log
          if ($LASTEXITCODE -ne 0) {
            Remove-Item $log -Force -ErrorAction SilentlyContinue
            Write-Error "Windows build failed. Output suppressed: private source must not appear in public logs."
            exit 1
          }
          Remove-Item $log -Force -ErrorAction SilentlyContinue
          # Debug symbols can embed source paths; ship only the runnable output.
          Get-ChildItem $out -Recurse -Include *.pdb -ErrorAction SilentlyContinue | Remove-Item -Force -ErrorAction SilentlyContinue
          $zip = Join-Path $env:RUNNER_TEMP $env:ASSET_NAME
          Compress-Archive -Path (Join-Path $out "*") -DestinationPath $zip -Force
          gh release upload $env:VERSION_TAG $zip --clobber --repo "$env:GITHUB_REPOSITORY"
          gh release upload $env:ROLLING_TAG $zip --clobber --repo "$env:GITHUB_REPOSITORY"

  macos:
    name: macOS
    needs: [version]
    if: ${{ needs.version.outputs.build_macos != 'false' }}
    runs-on: macos-latest
    steps:
      - name: Download the release plan
        uses: actions/download-artifact@v4
        with:
          name: release-plan
          path: ${{ runner.temp }}/release-plan

      - name: Read the release plan
        id: plan
        shell: bash
        run: |
          set -euo pipefail
          PLAN="$RUNNER_TEMP/release-plan/release-plan.json"
          test -f "$PLAN" || { echo "The release plan artifact is missing; the version job did not finish." >&2; exit 1; }
          {
            echo "enabled=$(jq -r '.platforms | index("macos") != null' "$PLAN")"
            echo "version=$(jq -r .version "$PLAN")"
            echo "tag=$(jq -r .tag "$PLAN")"
            echo "rolling_tag=$(jq -r .rollingTag "$PLAN")"
            echo "source_ref=$(jq -r .sourceRef "$PLAN")"
            echo "source_sha=$(jq -r .sourceSha "$PLAN")"
          } >> "$GITHUB_OUTPUT"

      - name: Check out private source (read-only)
        if: steps.plan.outputs.enabled == 'true'
        uses: actions/checkout@v4
        with:
          repository: ${{ env.PRIVATE_REPOSITORY }}
          ref: ${{ steps.plan.outputs.source_ref }}
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          persist-credentials: false

      - name: Build, package, and upload macOS app
        if: steps.plan.outputs.enabled == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PHANTOM_PRODUCT_VERSION: ${{ steps.plan.outputs.version }}
          VERSION_TAG: ${{ steps.plan.outputs.tag }}
          ROLLING_TAG: ${{ steps.plan.outputs.rolling_tag }}
          ASSET_NAME: Phantom-macOS-${{ steps.plan.outputs.version }}.zip
        run: |
          set -euo pipefail
          LOG="$RUNNER_TEMP/macos-build.log"
          if ! ./phantom-mac-app/Scripts/build-app.sh > "$LOG" 2>&1; then
            rm -f "$LOG"
            echo "macOS build failed. Output suppressed: private source must not appear in public logs." >&2
            exit 1
          fi
          rm -f "$LOG"
          ZIP="$RUNNER_TEMP/$ASSET_NAME"
          ditto -c -k --sequesterRsrc --keepParent phantom-mac-app/dist/Phantom.app "$ZIP"
          gh release upload "$VERSION_TAG" "$ZIP" --clobber --repo "$GITHUB_REPOSITORY"
          gh release upload "$ROLLING_TAG" "$ZIP" --clobber --repo "$GITHUB_REPOSITORY"

  android-build:
    name: Android build
    needs: [version]
    if: ${{ needs.version.outputs.build_android != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - name: Download the release plan
        uses: actions/download-artifact@v4
        with:
          name: release-plan
          path: ${{ runner.temp }}/release-plan

      - name: Read the release plan
        id: plan
        shell: bash
        run: |
          set -euo pipefail
          PLAN="$RUNNER_TEMP/release-plan/release-plan.json"
          test -f "$PLAN" || { echo "The release plan artifact is missing; the version job did not finish." >&2; exit 1; }
          {
            echo "enabled=$(jq -r '.platforms | index("android") != null' "$PLAN")"
            echo "version=$(jq -r .version "$PLAN")"
            echo "tag=$(jq -r .tag "$PLAN")"
            echo "rolling_tag=$(jq -r .rollingTag "$PLAN")"
            echo "source_ref=$(jq -r .sourceRef "$PLAN")"
            echo "source_sha=$(jq -r .sourceSha "$PLAN")"
            echo "version_code=$(jq -r .versionCode "$PLAN")"
          } >> "$GITHUB_OUTPUT"

      - name: Check out private source (read-only)
        if: steps.plan.outputs.enabled == 'true'
        uses: actions/checkout@v4
        with:
          repository: ${{ env.PRIVATE_REPOSITORY }}
          ref: ${{ steps.plan.outputs.source_ref }}
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          persist-credentials: false

      - name: Refuse to build if local env files were committed
        if: steps.plan.outputs.enabled == 'true'
        run: |
          set -euo pipefail
          # .env is gitignored repo-wide, but if one were ever force-added the Android secrets
          # plugin reads it and bakes the values into the APK, which is attached to a public
          # release. Fail loudly rather than publish secrets.
          if find . -name '.env' -not -path './.git/*' | grep -q .; then
            echo "A .env file is present in the checked-out source. Remove it before releasing." >&2
            exit 1
          fi
          echo "No .env files present in the checkout."

      - name: Set up JDK
        if: steps.plan.outputs.enabled == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        if: steps.plan.outputs.enabled == 'true'
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: wrapper

      - name: Ensure the required Android SDK platform
        if: steps.plan.outputs.enabled == 'true'
        env:
          REQUIRED_PLATFORM: platforms;android-36.1
        run: |
          set -euo pipefail
          PLATFORM="${REQUIRED_PLATFORM:-platforms;android-36.1}"
          PLATFORM_DIR="${PLATFORM#platforms;}"
          # Only SDK package names are printed, never source: safe for a public log.
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          echo "Android SDK root: ${SDK:-<unset>}"
          ls "${SDK}/platforms" 2>/dev/null || echo "(no platforms directory)"
          if [ -n "$SDK" ] && [ -d "$SDK/platforms/$PLATFORM_DIR" ]; then
            echo "$PLATFORM already present."
            exit 0
          fi
          if ! command -v sdkmanager >/dev/null 2>&1; then
            # Not fatal: AGP can still auto-download the platform during the build.
            echo "sdkmanager not on PATH; leaving it to AGP to fetch $PLATFORM."
            exit 0
          fi
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          if ! sdkmanager --install "$PLATFORM" >/dev/null 2>&1; then
            echo "Could not install $PLATFORM. Either the package does not exist for this SDK version, or the runner cannot reach dl.google.com." >&2
            exit 1
          fi
          echo "Installed $PLATFORM."

      - name: Build unsigned Android APK
        if: steps.plan.outputs.enabled == 'true'
        env:
          PHANTOM_VERSION_NAME: ${{ steps.plan.outputs.version }}
          PHANTOM_VERSION_CODE: ${{ steps.plan.outputs.version_code }}
        run: |
          set -euo pipefail
          LOG="$RUNNER_TEMP/android-build.log"
          if ! ./phantom-companion-android/gradlew --no-daemon -p phantom-companion-android :app:assembleRelease \
              "-PphantomVersionName=$PHANTOM_VERSION_NAME" \
              "-PphantomVersionCode=$PHANTOM_VERSION_CODE" \
              -PphantomSkipSigning=true > "$LOG" 2>&1; then
            # Report only a fixed category, never the log itself: the log can contain private
            # source paths because this repository is public.
            REASON="unrecognised failure"
            if grep -qi "licences have not been accepted" "$LOG"; then
              REASON="an Android SDK licence is not accepted"
            elif grep -qiE "Failed to find package|Could not find .*platform" "$LOG"; then
              REASON="the required Android SDK platform is unavailable"
            elif grep -qiE "keystore|Keystore was tampered|SigningConfig" "$LOG"; then
              REASON="a signing configuration problem"
            elif grep -qiE "Could not resolve|Could not download|Connection refused" "$LOG"; then
              REASON="dependency resolution failed (network or repository access)"
            elif grep -qiE "Unsupported class file major version|invalid source release" "$LOG"; then
              REASON="JDK version mismatch"
            fi
            rm -f "$LOG"
            echo "Android build failed: ${REASON}. Output suppressed: private source must not appear in public logs." >&2
            exit 1
          fi
          rm -f "$LOG"
          APK="$(find phantom-companion-android/app/build/outputs/apk/release -name '*.apk' 2>/dev/null | head -1 || true)"
          if [ -z "$APK" ]; then
            echo "Android build produced no APK." >&2
            exit 1
          fi
          cp "$APK" "$RUNNER_TEMP/phantom-android-unsigned.apk"
          echo "Produced unsigned APK from $(basename "$APK")."

      - name: Upload the unsigned APK for the signing job
        if: steps.plan.outputs.enabled == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: phantom-android-unsigned
          path: ${{ runner.temp }}/phantom-android-unsigned.apk
          if-no-files-found: error
          retention-days: 1
          # Needed when a re-run rebuilds this job inside the same workflow run.
          overwrite: true

  android-sign:
    name: Android sign
    needs: [version, android-build]
    if: ${{ needs.version.outputs.build_android != 'false' }}
    runs-on: ubuntu-latest
    # The signing key stays behind the protected environment in both channels: signing is the
    # risky step regardless of whether the artifact is beta or production.
    environment: android-release
    steps:
      - name: Download the release plan
        uses: actions/download-artifact@v4
        with:
          name: release-plan
          path: ${{ runner.temp }}/release-plan

      - name: Read the release plan
        id: plan
        shell: bash
        run: |
          set -euo pipefail
          PLAN="$RUNNER_TEMP/release-plan/release-plan.json"
          test -f "$PLAN" || { echo "The release plan artifact is missing; the version job did not finish." >&2; exit 1; }
          {
            echo "enabled=$(jq -r '.platforms | index("android") != null' "$PLAN")"
            echo "version=$(jq -r .version "$PLAN")"
            echo "tag=$(jq -r .tag "$PLAN")"
            echo "rolling_tag=$(jq -r .rollingTag "$PLAN")"
          } >> "$GITHUB_OUTPUT"

      - name: Check release signing secrets
        if: steps.plan.outputs.enabled == 'true'
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          # Named explicitly because it is the most likely failure, and this log is public.
          if [ -z "${KEYSTORE_B64:-}" ] || [ -z "${STORE_PASSWORD:-}" ] || [ -z "${KEY_PASSWORD:-}" ]; then
            echo "Android signing secrets are not configured: set ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, and ANDROID_KEY_PASSWORD on the android-release environment." >&2
            exit 1
          fi

      - name: Download the unsigned APK
        if: steps.plan.outputs.enabled == 'true'
        uses: actions/download-artifact@v4
        with:
          name: phantom-android-unsigned
          path: ${{ runner.temp }}/unsigned

      - name: Set up JDK for apksigner
        if: steps.plan.outputs.enabled == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Locate the Android SDK signing tools
        if: steps.plan.outputs.enabled == 'true'
        run: |
          set -euo pipefail
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          echo "Android SDK root: ${SDK:-<unset>}"
          find_tool() { find "$SDK/build-tools" -maxdepth 2 -name "$1" -type f 2>/dev/null | sort -V | tail -1; }
          APKSIGNER="$(find_tool apksigner || true)"
          ZIPALIGN="$(find_tool zipalign || true)"
          if [ -z "$APKSIGNER" ] || [ -z "$ZIPALIGN" ]; then
            if command -v sdkmanager >/dev/null 2>&1; then
              yes | sdkmanager --licenses >/dev/null 2>&1 || true
              sdkmanager --install "build-tools;36.0.0" >/dev/null 2>&1 || true
              APKSIGNER="$(find_tool apksigner || true)"
              ZIPALIGN="$(find_tool zipalign || true)"
            fi
          fi
          if [ -z "$APKSIGNER" ] || [ -z "$ZIPALIGN" ]; then
            echo "apksigner or zipalign not found. Install Android SDK build-tools on the runner." >&2
            exit 1
          fi
          {
            echo "APKSIGNER=$APKSIGNER"
            echo "ZIPALIGN=$ZIPALIGN"
          } >> "$GITHUB_ENV"
          echo "Using $APKSIGNER"

      - name: Sign, verify, and upload the Android APK
        if: steps.plan.outputs.enabled == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.plan.outputs.version }}
          VERSION_TAG: ${{ steps.plan.outputs.tag }}
          ROLLING_TAG: ${{ steps.plan.outputs.rolling_tag }}
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          KEYSTORE="$RUNNER_TEMP/phantom-upload-key.jks"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$KEYSTORE"

          UNSIGNED="$(find "$RUNNER_TEMP/unsigned" -name '*.apk' | head -1 || true)"
          if [ -z "$UNSIGNED" ]; then
            rm -f "$KEYSTORE"
            echo "No unsigned APK was downloaded." >&2
            exit 1
          fi

          # Alignment must be correct BEFORE signing, because re-aligning afterwards would
          # invalidate the signature. AGP already aligns its output, so this only asserts it.
          if ! "$ZIPALIGN" -c -P 16 -v 4 "$UNSIGNED" >/dev/null 2>&1; then
            rm -f "$KEYSTORE"
            echo "The unsigned APK is not 16 KB page aligned; refusing to sign it." >&2
            exit 1
          fi

          OUT="$RUNNER_TEMP/Phantom-Android-${VERSION}.apk"
          # Passwords are read from the environment so they never appear in a command line.
          if ! "$APKSIGNER" sign \
              --ks "$KEYSTORE" \
              --ks-key-alias "${KEY_ALIAS:-upload}" \
              --ks-pass env:STORE_PASSWORD \
              --key-pass env:KEY_PASSWORD \
              --out "$OUT" "$UNSIGNED" > "$RUNNER_TEMP/sign.log" 2>&1; then
            rm -f "$RUNNER_TEMP/sign.log" "$KEYSTORE"
            echo "Signing failed. Check the keystore, its passwords, and ANDROID_KEY_ALIAS." >&2
            exit 1
          fi
          rm -f "$RUNNER_TEMP/sign.log"

          # Prints the signing certificate, which ships inside the APK anyway: not a secret.
          "$APKSIGNER" verify --print-certs "$OUT"

          rm -f "$KEYSTORE" "$UNSIGNED"
          gh release upload "$VERSION_TAG" "$OUT" --clobber --repo "$GITHUB_REPOSITORY"
          gh release upload "$ROLLING_TAG" "$OUT" --clobber --repo "$GITHUB_REPOSITORY"

  # ---------------------------------------------------------------------------------------------
  # Publish: one writer per channel. Rewrites latest.json so each platform keeps its own pointer,
  # so a failed or skipped platform keeps serving its previous good build instead of blocking the
  # rest of the release. Runs even when a build failed; re-runs are idempotent because the plan
  # (and therefore the tag) is pinned.
  # ---------------------------------------------------------------------------------------------
  publish:
    name: Publish
    needs: [version, windows, macos, android-build, android-sign]
    # A failed platform is an expected outcome to publish around, so do not inherit the default
    # "all needs succeeded" rule. version failing means there is no plan to publish and a re-run
    # of only the failed jobs is not possible anyway.
    if: ${{ !cancelled() && needs.version.result != 'failure' }}
    runs-on: ubuntu-latest
    steps:
      - name: Download the release plan
        uses: actions/download-artifact@v4
        with:
          name: release-plan
          path: ${{ runner.temp }}/release-plan

      - name: Update download pointers and publish latest.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PLAN_FILE: ${{ runner.temp }}/release-plan/release-plan.json
        run: |
          set -euo pipefail
          PLAN="$PLAN_FILE"
          if [ ! -f "$PLAN" ]; then
            echo "The release plan artifact is missing; the version job did not finish." >&2
            exit 1
          fi
          WORK="$(mktemp -d)"
          VERSION="$(jq -r .version "$PLAN")"
          TAG="$(jq -r .tag "$PLAN")"
          ROLLING_TAG="$(jq -r .rollingTag "$PLAN")"
          CHANNEL="$(jq -r .channel "$PLAN")"

          EXISTING_MANIFEST=""
          mkdir -p "$WORK/existing"
          # Missing latest.json on a brand-new channel is normal; any other failure is not.
          if gh release download "$ROLLING_TAG" --repo "$GITHUB_REPOSITORY" --pattern latest.json --dir "$WORK/existing" >/dev/null 2>&1; then
            EXISTING_MANIFEST="$WORK/existing/latest.json"
          else
            echo "No previous latest.json on $ROLLING_TAG (first release on this channel)."
          fi

          if ! RELEASE_ASSETS="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '[.assets[].name]')"; then
            echo "Could not read the assets of $TAG. Verify the tag exists and the token can read releases." >&2
            exit 1
          fi

          export VERSION TAG ROLLING_TAG CHANNEL EXISTING_MANIFEST RELEASE_ASSETS
          export RUN_ID="$(jq -r .runId "$PLAN")"
          export RUN_NUMBER="$(jq -r .runNumber "$PLAN")"
          export VERSION_CODE="$(jq -r .versionCode "$PLAN")"
          export SOURCE_REF="$(jq -r .sourceRef "$PLAN")"
          export SOURCE_SHA="$(jq -r .sourceSha "$PLAN")"
          export PLATFORMS="$(jq -r '.platforms | join(",")' "$PLAN")"
          export MANIFEST_OUT="$WORK/latest.json"
          export NOTES_VERSION_OUT="$WORK/notes-version.md"
          export NOTES_ROLLING_OUT="$WORK/notes-rolling.md"
          export KEEP_OUT="$WORK/keep.txt"
          export RESULT_OUT="$WORK/result.json"

          python3 <<'PY'
          import datetime
          import json
          import os


          def need(name):
              value = os.environ.get(name, "").strip()
              if not value:
                  raise SystemExit(f"{name} is empty")
              return value


          channel = need("CHANNEL")
          version = need("VERSION")
          tag = need("TAG")
          source_ref = os.environ.get("SOURCE_REF", "")
          source_sha = os.environ.get("SOURCE_SHA", "")
          run_id = int(need("RUN_ID"))
          # GITHUB_RUN_ID is the workflow run id; GITHUB_RUN_NUMBER is the build counter the
          # old manifest exposed as runNumber. Keep them separate.
          run_number = int(need("RUN_NUMBER"))
          version_code = int(need("VERSION_CODE"))
          selected = [p for p in os.environ.get("PLATFORMS", "").split(",") if p]
          release_assets = set(json.loads(os.environ.get("RELEASE_ASSETS", "[]")))
          existing_path = os.environ.get("EXISTING_MANIFEST", "")

          ASSET_NAMES = {
              "windows": f"Phantom-Windows-x64-{version}.zip",
              "macos": f"Phantom-macOS-{version}.zip",
              "android": f"Phantom-Android-{version}.apk",
          }
          LEGACY_NAMES = {
              "windows": "Phantom-Windows-x64.zip",
              "macos": "Phantom-macOS.zip",
              "android": "Phantom-Android.apk",
          }


          def semver(text):
              base = (text or "").split("-", 1)[0].split("+", 1)[0]
              numbers = [int(part) for part in base.split(".") if part.isdigit()]
              while len(numbers) < 3:
                  numbers.append(0)
              return tuple(numbers[:3])


          previous = {}
          if existing_path and os.path.exists(existing_path):
              try:
                  with open(existing_path, encoding="utf-8") as handle:
                      previous = json.load(handle)
              except (OSError, json.JSONDecodeError):
                  previous = {}
          previous_platforms = previous.get("platforms") or {}

          now = datetime.datetime.now(datetime.timezone.utc).replace(microsecond=0).isoformat().replace("+00:00", "Z")

          # Each platform moves independently: only a build that produced this version's asset
          # advances that platform's pointer. Everything else keeps serving its previous build.
          platforms = {}
          published = []
          missing = []
          carried = []

          for name in ("windows", "macos", "android"):
              pointer = previous_platforms.get(name)
              asset = ASSET_NAMES[name]
              present = asset in release_assets
              selected_here = name in selected

              if selected_here and present:
                  pointer_version = (pointer or {}).get("version", "")
                  if pointer is not None and semver(version) < semver(pointer_version):
                      # A late re-run of an older release must not roll this platform back.
                      platforms[name] = pointer
                      carried.append(name)
                  else:
                      platforms[name] = {
                          "version": version,
                          "tag": tag,
                          "asset": asset,
                          "ref": source_ref,
                          "sha": source_sha,
                          "runId": run_id,
                          "publishedAt": now,
                      }
                      published.append(name)
              elif pointer is not None:
                  platforms[name] = pointer
                  if not selected_here:
                      carried.append(name)

              if selected_here and not present:
                  missing.append(name)

          # The channel's headline version only advances when this run actually published
          # something. A run where every selected build failed creates an empty release but must
          # not advertise a version that has no downloadable assets. When this run owns the
          # current version already (a re-run), its metadata is rewritten so the record stays
          # self-consistent instead of inheriting an older run's numbers.
          top_version = previous.get("version") or ""
          same_as_top = bool(top_version) and semver(version) == semver(top_version)
          advance = bool(published) and (not top_version or semver(version) > semver(top_version))
          if not top_version or same_as_top or advance:
              top = {
                  "version": version,
                  "tag": tag,
                  "ref": source_ref,
                  "sha": source_sha,
                  "runNumber": run_number,
                  "versionCode": version_code,
              }
          else:
              top = {
                  "version": top_version,
                  "tag": previous.get("tag") or tag,
                  "ref": previous.get("ref") or source_ref,
                  "sha": previous.get("sha") or source_sha,
                  "runNumber": previous.get("runNumber") or run_number,
                  "versionCode": previous.get("versionCode") or version_code,
              }

          manifest = {
              "channel": channel,
              "version": top["version"],
              "tag": top["tag"],
              "ref": top["ref"],
              "sha": top["sha"],
              "runNumber": top["runNumber"],
              "versionCode": top["versionCode"],
              "publishedAt": now,
              "platforms": platforms,
              "lastRun": {
                  "runId": run_id,
                  "runNumber": run_number,
                  "version": version,
                  "tag": tag,
                  "published": published,
                  "missing": missing,
                  "keptPrevious": carried,
              },
          }


          def pointer_line(name):
              pointer = platforms.get(name)
              if not pointer:
                  return f"- {name}: not published yet"
              return f"- {name}: {pointer['version']} ({pointer['asset']})"


          version_lines = [
              f"Phantom Desktop {version} (unsigned) from {source_ref} ({source_sha}).",
              "",
              f"channel: {channel}",
              f"version: {version}",
              f"run: {run_id}",
              f"ref: {source_ref}",
              f"sha: {source_sha}",
              f"platforms: {','.join(selected) or 'none'}",
              "",
              f"published in this run: {', '.join(published) or 'none'}",
          ]
          if missing:
              version_lines.append(f"missing from this run: {', '.join(missing)} (their pointers keep the previous build)")
          if carried:
              version_lines.append(f"not selected in this run: {', '.join(carried)} (pointers unchanged)")
          version_lines += ["", "Current download pointers:"] + [pointer_line(name) for name in ("windows", "macos", "android")]

          rolling_lines = [
              f"Phantom Desktop - {channel} channel",
              "",
              "Download the file for your platform, or read latest.json for the machine-readable pointers.",
              "",
          ] + [pointer_line(name) for name in ("windows", "macos", "android")] + [
              "",
              f"Last update: {now} (run {run_id}, version {version}).",
          ]

          keep = ["latest.json"]
          for pointer in platforms.values():
              if pointer and pointer.get("asset"):
                  keep.append(pointer["asset"])
          for name in ("windows", "macos", "android"):
              if name not in platforms:
                  # Transitional: until every platform has a versioned pointer, the rolling
                  # release keeps the old unversioned names so download links cannot 404.
                  keep.append(LEGACY_NAMES[name])

          result = {
              "version": top["version"],
              "tag": top["tag"],
              "published": published,
              "missing": missing,
              "carried": carried,
              "platforms": {name: (pointer or {}).get("version", "") for name, pointer in platforms.items()},
          }

          def write(path, text):
              with open(path, "w", encoding="utf-8", newline="\n") as handle:
                  handle.write(text)


          write(os.environ["MANIFEST_OUT"], json.dumps(manifest, indent=2) + "\n")
          write(os.environ["NOTES_VERSION_OUT"], "\n".join(version_lines) + "\n")
          write(os.environ["NOTES_ROLLING_OUT"], "\n".join(rolling_lines) + "\n")
          write(os.environ["KEEP_OUT"], "\n".join(keep) + "\n")
          write(os.environ["RESULT_OUT"], json.dumps(result) + "\n")
          PY

          gh release upload "$ROLLING_TAG" "$WORK/latest.json" --clobber --repo "$GITHUB_REPOSITORY"
          gh release edit "$TAG" --notes-file "$WORK/notes-version.md" --repo "$GITHUB_REPOSITORY"
          gh release edit "$ROLLING_TAG" --notes-file "$WORK/notes-rolling.md" --repo "$GITHUB_REPOSITORY"

          # The rolling release is a download surface, not a history: keep only the assets that
          # a current pointer references (plus these transitional legacy names).
          while IFS= read -r asset; do
            [ -n "$asset" ] || continue
            if grep -Fxq "$asset" "$WORK/keep.txt"; then
              continue
            fi
            gh release delete-asset "$ROLLING_TAG" "$asset" --yes --repo "$GITHUB_REPOSITORY" >/dev/null
            echo "Removed stale rolling asset $asset."
          done < <(gh release view "$ROLLING_TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')

          {
            echo "### Desktop release $(jq -r .version "$WORK/result.json")"
            echo ""
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Channel | $CHANNEL |"
            echo "| Release | $VERSION ($TAG) |"
            echo "| Rolling tag | $ROLLING_TAG |"
            echo "| Published now | $(jq -r '.published | join(", ")' "$WORK/result.json") |"
            echo "| Missing now | $(jq -r '.missing | join(", ")' "$WORK/result.json") |"
            echo "| Pointers | $(jq -r '.platforms | to_entries | map("\(.key) \(.value // "none")") | join(", ")' "$WORK/result.json") |"
          } >> "$GITHUB_STEP_SUMMARY"

          MISSING="$(jq -r '.missing | join(", ")' "$WORK/result.json")"
          if [ -n "$MISSING" ]; then
            echo "::warning::Not built in this run: ${MISSING}. Their download pointers still serve the previous build; re-run the failed job(s) to finish this release."
          fi

      - name: Assert releases expose only the current compiled outputs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PLAN_FILE: ${{ runner.temp }}/release-plan/release-plan.json
        run: |
          set -euo pipefail
          # Tripwire, not prevention: every release asset is anonymously downloadable because this
          # repository is public, so if a future change ever attaches source or a stray file, fail
          # the run loudly. The checks also prove that latest.json cannot point at a missing file.
          PLAN="$PLAN_FILE"
          VERSION="$(jq -r .version "$PLAN")"
          TAG="$(jq -r .tag "$PLAN")"
          ROLLING_TAG="$(jq -r .rollingTag "$PLAN")"
          CHANNEL="$(jq -r .channel "$PLAN")"
          SELECTED="$(jq -r '.platforms | join(",")' "$PLAN")"

          WORK="$(mktemp -d)"
          if ! gh release download "$ROLLING_TAG" --repo "$GITHUB_REPOSITORY" --pattern latest.json --dir "$WORK"; then
            echo "latest.json is missing from $ROLLING_TAG." >&2
            exit 1
          fi

          ALLOWED_IMMUTABLE="$(printf '%s\n' \
            "Phantom-Windows-x64-${VERSION}.zip" \
            "Phantom-macOS-${VERSION}.zip" \
            "Phantom-Android-${VERSION}.apk" | LC_ALL=C sort)"
          if ! FOUND_IMMUTABLE="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | LC_ALL=C sort)"; then
            echo "Could not read the asset list for $TAG." >&2
            exit 1
          fi

          # 1. Every asset on the immutable release is a build output for this exact version.
          while IFS= read -r name; do
            [ -n "$name" ] || continue
            if ! grep -Fxq "$name" <<< "$ALLOWED_IMMUTABLE"; then
              echo "Unexpected asset '$name' on $TAG." >&2
              exit 1
            fi
          done <<< "$FOUND_IMMUTABLE"

          # 2. Every pointer names a real file on a tag that belongs to this channel.
          while IFS=$'\t' read -r platform pointer_tag pointer_asset; do
            [ -n "$platform" ] || continue
            case "$platform:$CHANNEL" in
              *:staging) case "$pointer_tag" in *-staging) ;; *) echo "latest.json points $platform at $pointer_tag, which is not a staging tag." >&2; exit 1 ;; esac ;;
              *:prod)    case "$pointer_tag" in *-staging) echo "latest.json points $platform at $pointer_tag, which is a staging tag." >&2; exit 1 ;; esac ;;
            esac
            if ! POINTER_ASSETS="$(gh release view "$pointer_tag" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')"; then
              echo "Could not read the asset list for $pointer_tag (pointer for $platform)." >&2
              exit 1
            fi
            if ! grep -Fxq "$pointer_asset" <<< "$POINTER_ASSETS"; then
              echo "latest.json points $platform at $pointer_tag, which has no $pointer_asset." >&2
              exit 1
            fi
          done < <(jq -r '.platforms // {} | to_entries[] | [.key, .value.tag, .value.asset] | @tsv' "$WORK/latest.json")

          # 3. If a platform's asset exists for this version it must be the recorded pointer.
          for platform in windows macos android; do
            case ",$SELECTED," in *",$platform,"*) ;; *) continue ;; esac
            case "$platform" in
              windows) asset="Phantom-Windows-x64-${VERSION}.zip" ;;
              macos) asset="Phantom-macOS-${VERSION}.zip" ;;
              android) asset="Phantom-Android-${VERSION}.apk" ;;
            esac
            if grep -Fxq "$asset" <<< "$FOUND_IMMUTABLE"; then
              RECORDED="$(jq -r --arg p "$platform" '.platforms[$p].version // ""' "$WORK/latest.json")"
              if [ "$RECORDED" != "$VERSION" ]; then
                echo "$platform was published as $VERSION but latest.json records '$RECORDED'." >&2
                exit 1
              fi
            fi
          done

          # 4. The rolling release may only hold latest.json and the files its pointers name.
          KEEP="$(mktemp)"
          echo "latest.json" >> "$KEEP"
          jq -r '.platforms // {} | to_entries[] | .value.asset' "$WORK/latest.json" >> "$KEEP"
          for platform in windows macos android; do
            if [ "$(jq -r --arg p "$platform" '.platforms[$p] // empty' "$WORK/latest.json")" = "" ]; then
              case "$platform" in
                windows) echo "Phantom-Windows-x64.zip" >> "$KEEP" ;;
                macos) echo "Phantom-macOS.zip" >> "$KEEP" ;;
                android) echo "Phantom-Android.apk" >> "$KEEP" ;;
              esac
            fi
          done
          while IFS= read -r name; do
            [ -n "$name" ] || continue
            if ! grep -Fxq "$name" "$KEEP"; then
              echo "Unexpected asset '$name' on $ROLLING_TAG." >&2
              exit 1
            fi
          done <<< "$(gh release view "$ROLLING_TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')"

          echo "Both releases expose only the current compiled outputs ($CHANNEL channel, $VERSION)."
