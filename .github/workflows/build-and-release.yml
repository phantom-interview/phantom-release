name: Build and release desktop apps

on:
  repository_dispatch:
    types: [desktop-release]
  workflow_dispatch:
    inputs:
      major_minor:
        description: "MAJOR.MINOR only (for example 1.0 or 2.3). Leave empty to keep the last prefix."
        required: false
        type: string
        default: ""
      source_ref:
        description: "Branch, tag, or SHA of the private source to build. Leave empty for the private repo's default branch."
        required: false
        type: string
        default: ""

permissions:
  contents: write
  actions: read

concurrency:
  group: desktop-release
  cancel-in-progress: true

env:
  PRIVATE_REPOSITORY: tapas-patra/Phantom
  # Used only when the private repo's default branch cannot be read from the API. The real
  # default branch is resolved at run time, so a rename upstream needs no edit here.
  PRIVATE_SOURCE_REF_FALLBACK: master
  ROLLING_TAG: desktop-latest

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.compute.outputs.version }}
      tag: ${{ steps.compute.outputs.tag }}
      source_ref: ${{ steps.compute.outputs.source_ref }}
      source_sha: ${{ steps.compute.outputs.source_sha }}
    steps:
      - name: Compute desktop version and source ref
        id: compute
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PRIVATE_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
          INPUT_MAJOR_MINOR: ${{ github.event.inputs.major_minor }}
          DISPATCH_MAJOR_MINOR: ${{ github.event.client_payload.major_minor }}
          INPUT_SOURCE_REF: ${{ github.event.inputs.source_ref }}
          DISPATCH_SOURCE_REF: ${{ github.event.client_payload.source_ref }}
          DISPATCH_SOURCE_SHA: ${{ github.event.client_payload.source_sha }}
        run: |
          set -euo pipefail
          # --- which private branch/tag/SHA to build -------------------------------------
          # Precedence: explicit workflow_dispatch input, then the dispatch payload,
          # then the private repo's own default branch.
          REF="$(printf '%s' "${INPUT_SOURCE_REF:-${DISPATCH_SOURCE_REF:-}}" | tr -d '[:space:]')"
          if [ -n "$REF" ]; then
            if printf '%s' "$REF" | grep -q '\.\.' || printf '%s' "$REF" | grep -Eq '^-'; then
              echo "source_ref is not a valid branch, tag, or SHA." >&2
              exit 1
            fi
          else
            REF="$(GH_TOKEN="$PRIVATE_TOKEN" gh api "repos/$PRIVATE_REPOSITORY" --jq '.default_branch' 2>/dev/null || true)"
          fi
          REF="${REF:-$PRIVATE_SOURCE_REF_FALLBACK}"
          # Record the commit that is actually built, so release notes and latest.json do not
          # claim a different revision when a branch other than the trigger branch is built.
          RESOLVED_SHA="$(GH_TOKEN="$PRIVATE_TOKEN" gh api -X GET "repos/$PRIVATE_REPOSITORY/commits" \
            -f "sha=$REF" -f "per_page=1" --jq '.[0].sha' 2>/dev/null || true)"
          SOURCE_SHA="${RESOLVED_SHA:-${DISPATCH_SOURCE_SHA:-$GITHUB_SHA}}"
          echo "source_ref=$REF" >> "$GITHUB_OUTPUT"
          echo "source_sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
          echo "Building $PRIVATE_REPOSITORY@$REF ($SOURCE_SHA)"
          # --- version prefix and third component ----------------------------------------
          INPUT="$(printf '%s' "${INPUT_MAJOR_MINOR:-${DISPATCH_MAJOR_MINOR:-}}" | tr -d '[:space:]')"
          LAST_VERSION=""
          if [ -n "$INPUT" ]; then
            if ! printf '%s' "$INPUT" | grep -Eq '^[0-9]+\.[0-9]+$'; then
              echo "major_minor must be MAJOR.MINOR, for example 1.0 or 2.3" >&2
              exit 1
            fi
            PREFIX="$INPUT"
          else
            PREFIX=""
            WORK="$(mktemp -d)"
            if gh release download "$ROLLING_TAG" --repo "$GITHUB_REPOSITORY" --pattern latest.json --dir "$WORK" >/dev/null 2>&1 \
              && [ -f "$WORK/latest.json" ]; then
              LAST="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1])).get("version",""))' "$WORK/latest.json" || true)"
              LAST_VERSION="$LAST"
              if printf '%s' "$LAST" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
                PREFIX="$(printf '%s' "$LAST" | awk -F. '{print $1"."$2}')"
              fi
            fi
            if [ -z "$PREFIX" ]; then
              TAGS="$(gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName --jq '.[].tagName' || true)"
              CANDIDATE="$(printf '%s\n' "$TAGS" | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1 | sed 's/^v//')"
              if [ -n "$CANDIDATE" ]; then
                PREFIX="$(printf '%s' "$CANDIDATE" | awk -F. '{print $1"."$2}')"
              fi
            fi
            PREFIX="${PREFIX:-1.0}"
          fi
          # Third component is this public repo's run number, but never lower than the last
          # release on the same MAJOR.MINOR. Without this guard the numbering would restart at
          # ".1" here and look like a downgrade from the previous private-repo builds.
          THIRD="$GITHUB_RUN_NUMBER"
          if printf '%s' "$LAST_VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            LAST_PREFIX="$(printf '%s' "$LAST_VERSION" | awk -F. '{print $1"."$2}')"
            LAST_THIRD="$(printf '%s' "$LAST_VERSION" | awk -F. '{print $3}')"
            if [ "$PREFIX" = "$LAST_PREFIX" ] && [ "$LAST_THIRD" -ge "$THIRD" ]; then
              THIRD=$((LAST_THIRD + 1))
            fi
          fi
          VERSION="${PREFIX}.${THIRD}"
          TAG="v${VERSION}"
          echo "prefix=$PREFIX" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Desktop version $VERSION (tag $TAG)"

  prepare-release:
    needs: [version]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
      VERSION_TAG: ${{ needs.version.outputs.tag }}
      SOURCE_REF: ${{ needs.version.outputs.source_ref }}
      SOURCE_SHA: ${{ needs.version.outputs.source_sha }}
    steps:
      - name: Ensure rolling and versioned GitHub Releases exist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          NOTES="Phantom Desktop $VERSION (unsigned) from $SOURCE_REF ($SOURCE_SHA)."
          gh release view "$ROLLING_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create "$ROLLING_TAG" --repo "$GITHUB_REPOSITORY" \
              --title "Phantom Desktop (latest)" --notes "$NOTES"
          gh release view "$VERSION_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create "$VERSION_TAG" --repo "$GITHUB_REPOSITORY" \
              --title "Phantom Desktop $VERSION" --notes "$NOTES"

  windows:
    needs: [version, prepare-release]
    runs-on: windows-latest
    env:
      PHANTOM_PRODUCT_VERSION: ${{ needs.version.outputs.version }}
      VERSION_TAG: ${{ needs.version.outputs.tag }}
    steps:
      - name: Check out private source (read-only)
        uses: actions/checkout@v4
        with:
          repository: ${{ env.PRIVATE_REPOSITORY }}
          ref: ${{ needs.version.outputs.source_ref }}
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          persist-credentials: false
      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Build, package, and upload Windows app
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $out = Join-Path $env:RUNNER_TEMP "windows-out"
          $log = Join-Path $env:RUNNER_TEMP "windows-build.log"
          dotnet publish phantom-windows-app/SecureOverlay.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -p:PhantomProductVersion=$env:PHANTOM_PRODUCT_VERSION -p:IncludeSourceRevisionInInformationalVersion=false -o $out *> $log
          if ($LASTEXITCODE -ne 0) {
            Remove-Item $log -Force -ErrorAction SilentlyContinue
            Write-Error "Windows build failed. Output suppressed: private source must not appear in public logs."
            exit 1
          }
          Remove-Item $log -Force -ErrorAction SilentlyContinue
          # Debug symbols can embed source paths; ship only the runnable output.
          Get-ChildItem $out -Recurse -Include *.pdb -ErrorAction SilentlyContinue | Remove-Item -Force -ErrorAction SilentlyContinue
          $zip = Join-Path $env:RUNNER_TEMP "Phantom-Windows-x64.zip"
          Compress-Archive -Path (Join-Path $out "*") -DestinationPath $zip -Force
          gh release upload $env:VERSION_TAG $zip --clobber --repo "$env:GITHUB_REPOSITORY"
          gh release upload "$env:ROLLING_TAG" $zip --clobber --repo "$env:GITHUB_REPOSITORY"

  macos:
    needs: [version, prepare-release]
    runs-on: macos-14
    env:
      PHANTOM_PRODUCT_VERSION: ${{ needs.version.outputs.version }}
      VERSION_TAG: ${{ needs.version.outputs.tag }}
    steps:
      - name: Check out private source (read-only)
        uses: actions/checkout@v4
        with:
          repository: ${{ env.PRIVATE_REPOSITORY }}
          ref: ${{ needs.version.outputs.source_ref }}
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          persist-credentials: false
      - name: Build, package, and upload macOS app
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          LOG="$RUNNER_TEMP/macos-build.log"
          if ! ./phantom-mac-app/Scripts/build-app.sh > "$LOG" 2>&1; then
            rm -f "$LOG"
            echo "macOS build failed. Output suppressed: private source must not appear in public logs." >&2
            exit 1
          fi
          rm -f "$LOG"
          ZIP="$RUNNER_TEMP/Phantom-macOS.zip"
          ditto -c -k --sequesterRsrc --keepParent phantom-mac-app/dist/Phantom.app "$ZIP"
          gh release upload "$VERSION_TAG" "$ZIP" --clobber --repo "$GITHUB_REPOSITORY"
          gh release upload "$ROLLING_TAG" "$ZIP" --clobber --repo "$GITHUB_REPOSITORY"


  android-build:
    needs: [version, prepare-release]
    runs-on: ubuntu-latest
    env:
      PHANTOM_VERSION_NAME: ${{ needs.version.outputs.version }}
      PHANTOM_VERSION_CODE: ${{ github.run_number }}
    steps:
      - name: Check out private source (read-only)
        uses: actions/checkout@v4
        with:
          repository: ${{ env.PRIVATE_REPOSITORY }}
          ref: ${{ needs.version.outputs.source_ref }}
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          persist-credentials: false
      - name: Refuse to build if local env files were committed
        run: |
          set -euo pipefail
          # .env is gitignored repo-wide, but if one were ever force-added the Android secrets
          # plugin reads it and bakes the values into the APK, which is attached to a public
          # release. Fail loudly rather than publish secrets.
          if find . -name '.env' -not -path './.git/*' | grep -q .; then
            echo "A .env file is present in the checked-out source. Remove it before releasing." >&2
            exit 1
          fi
          echo "No .env files present in the checkout."
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: wrapper
      - name: Ensure the required Android SDK platform
        env:
          REQUIRED_PLATFORM: platforms;android-36.1
        run: |
          set -euo pipefail
          PLATFORM="${REQUIRED_PLATFORM:-platforms;android-36.1}"
          PLATFORM_DIR="${PLATFORM#platforms;}"
          # Only SDK package names are printed, never source: safe for a public log.
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          echo "Android SDK root: ${SDK:-<unset>}"
          ls "${SDK}/platforms" 2>/dev/null || echo "(no platforms directory)"
          if [ -n "$SDK" ] && [ -d "$SDK/platforms/$PLATFORM_DIR" ]; then
            echo "$PLATFORM already present."
            exit 0
          fi
          if ! command -v sdkmanager >/dev/null 2>&1; then
            # Not fatal: AGP can still auto-download the platform during the build.
            echo "sdkmanager not on PATH; leaving it to AGP to fetch $PLATFORM."
            exit 0
          fi
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          if ! sdkmanager --install "$PLATFORM" >/dev/null 2>&1; then
            echo "Could not install $PLATFORM. Either the package does not exist for this SDK version, or the runner cannot reach dl.google.com." >&2
            exit 1
          fi
          echo "Installed $PLATFORM."
      - name: Build unsigned Android APK
        run: |
          set -euo pipefail
          LOG="$RUNNER_TEMP/android-build.log"
          if ! ./phantom-companion-android/gradlew --no-daemon -p phantom-companion-android :app:assembleRelease \
              "-PphantomVersionName=$PHANTOM_VERSION_NAME" \
              "-PphantomVersionCode=$PHANTOM_VERSION_CODE" \
              -PphantomSkipSigning=true > "$LOG" 2>&1; then
            # Report only a fixed category, never the log itself: the log can contain private
            # source paths because this repository is public.
            REASON="unrecognised failure"
            if grep -qi "licences have not been accepted" "$LOG"; then
              REASON="an Android SDK licence is not accepted"
            elif grep -qiE "Failed to find package|Could not find .*platform" "$LOG"; then
              REASON="the required Android SDK platform is unavailable"
            elif grep -qiE "keystore|Keystore was tampered|SigningConfig" "$LOG"; then
              REASON="a signing configuration problem"
            elif grep -qiE "Could not resolve|Could not download|Connection refused" "$LOG"; then
              REASON="dependency resolution failed (network or repository access)"
            elif grep -qiE "Unsupported class file major version|invalid source release" "$LOG"; then
              REASON="JDK version mismatch"
            fi
            rm -f "$LOG"
            echo "Android build failed: ${REASON}. Output suppressed: private source must not appear in public logs." >&2
            exit 1
          fi
          rm -f "$LOG"
          APK="$(find phantom-companion-android/app/build/outputs/apk/release -name '*.apk' 2>/dev/null | head -1 || true)"
          if [ -z "$APK" ]; then
            echo "Android build produced no APK." >&2
            exit 1
          fi
          cp "$APK" "$RUNNER_TEMP/phantom-android-unsigned.apk"
          echo "Produced unsigned APK from $(basename "$APK")."
      - name: Upload the unsigned APK for the signing job
        uses: actions/upload-artifact@v4
        with:
          name: phantom-android-unsigned
          path: ${{ runner.temp }}/phantom-android-unsigned.apk
          if-no-files-found: error
          retention-days: 1

  android-sign:
    needs: [version, prepare-release, android-build]
    runs-on: ubuntu-latest
    environment: android-release
    env:
      VERSION_TAG: ${{ needs.version.outputs.tag }}
    steps:
      - name: Check release signing secrets
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          # Named explicitly because it is the most likely failure, and this log is public.
          if [ -z "${KEYSTORE_B64:-}" ] || [ -z "${STORE_PASSWORD:-}" ] || [ -z "${KEY_PASSWORD:-}" ]; then
            echo "Android signing secrets are not configured: set ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, and ANDROID_KEY_PASSWORD on the android-release environment." >&2
            exit 1
          fi
      - name: Download the unsigned APK
        uses: actions/download-artifact@v4
        with:
          name: phantom-android-unsigned
          path: ${{ runner.temp }}/unsigned
      - name: Set up JDK for apksigner
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Locate the Android SDK signing tools
        run: |
          set -euo pipefail
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          echo "Android SDK root: ${SDK:-<unset>}"
          find_tool() { find "$SDK/build-tools" -maxdepth 2 -name "$1" -type f 2>/dev/null | sort -V | tail -1; }
          APKSIGNER="$(find_tool apksigner || true)"
          ZIPALIGN="$(find_tool zipalign || true)"
          if [ -z "$APKSIGNER" ] || [ -z "$ZIPALIGN" ]; then
            if command -v sdkmanager >/dev/null 2>&1; then
              yes | sdkmanager --licenses >/dev/null 2>&1 || true
              sdkmanager --install "build-tools;36.0.0" >/dev/null 2>&1 || true
              APKSIGNER="$(find_tool apksigner || true)"
              ZIPALIGN="$(find_tool zipalign || true)"
            fi
          fi
          if [ -z "$APKSIGNER" ] || [ -z "$ZIPALIGN" ]; then
            echo "apksigner or zipalign not found. Install Android SDK build-tools on the runner." >&2
            exit 1
          fi
          {
            echo "APKSIGNER=$APKSIGNER"
            echo "ZIPALIGN=$ZIPALIGN"
          } >> "$GITHUB_ENV"
          echo "Using $APKSIGNER"
      - name: Sign, verify, and upload the Android APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          KEYSTORE="$RUNNER_TEMP/phantom-upload-key.jks"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$KEYSTORE"

          UNSIGNED="$(find "$RUNNER_TEMP/unsigned" -name '*.apk' | head -1 || true)"
          if [ -z "$UNSIGNED" ]; then
            rm -f "$KEYSTORE"
            echo "No unsigned APK was downloaded." >&2
            exit 1
          fi

          # Alignment must be correct BEFORE signing, because re-aligning afterwards would
          # invalidate the signature. AGP already aligns its output, so this only asserts it.
          if ! "$ZIPALIGN" -c -P 16 -v 4 "$UNSIGNED" >/dev/null 2>&1; then
            rm -f "$KEYSTORE"
            echo "The unsigned APK is not 16 KB page aligned; refusing to sign it." >&2
            exit 1
          fi

          OUT="$RUNNER_TEMP/Phantom-Android.apk"
          # Passwords are read from the environment so they never appear in a command line.
          if ! "$APKSIGNER" sign \
              --ks "$KEYSTORE" \
              --ks-key-alias "${KEY_ALIAS:-upload}" \
              --ks-pass env:STORE_PASSWORD \
              --key-pass env:KEY_PASSWORD \
              --out "$OUT" "$UNSIGNED" > "$RUNNER_TEMP/sign.log" 2>&1; then
            rm -f "$RUNNER_TEMP/sign.log" "$KEYSTORE"
            echo "Signing failed. Check the keystore, its passwords, and ANDROID_KEY_ALIAS." >&2
            exit 1
          fi
          rm -f "$RUNNER_TEMP/sign.log"

          # Prints the signing certificate, which ships inside the APK anyway: not a secret.
          "$APKSIGNER" verify --print-certs "$OUT"

          rm -f "$KEYSTORE" "$UNSIGNED"
          gh release upload "$VERSION_TAG" "$OUT" --clobber --repo "$GITHUB_REPOSITORY"
          gh release upload "$ROLLING_TAG" "$OUT" --clobber --repo "$GITHUB_REPOSITORY"

  publish:
    needs: [version, windows, macos, android-sign]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
      VERSION_TAG: ${{ needs.version.outputs.tag }}
      SOURCE_REF: ${{ needs.version.outputs.source_ref }}
      SOURCE_SHA: ${{ needs.version.outputs.source_sha }}
    steps:
      - name: Publish latest.json and stamp release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          payload = {
            "version": os.environ["VERSION"],
            "tag": os.environ["VERSION_TAG"],
            "ref": os.environ["SOURCE_REF"],
            "sha": os.environ["SOURCE_SHA"],
            "runNumber": int(os.environ["GITHUB_RUN_NUMBER"]),
          }
          open("latest.json", "w", encoding="utf-8").write(json.dumps(payload) + "\n")
          PY
          NOTES="Phantom Desktop $VERSION (unsigned) from $SOURCE_REF ($SOURCE_SHA)."
          gh release upload "$ROLLING_TAG" latest.json --clobber --repo "$GITHUB_REPOSITORY"
          gh release edit "$ROLLING_TAG" --notes "$NOTES" --repo "$GITHUB_REPOSITORY"
          gh release edit "$VERSION_TAG" --notes "$NOTES" --repo "$GITHUB_REPOSITORY"
      - name: Assert releases expose only compiled build outputs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Tripwire, not prevention: every release asset is anonymously downloadable because this
          # repository is public, so if a future change ever attaches source or a stray file, fail
          # the run loudly. Runs last because latest.json is uploaded by the step above.
          # The two tags intentionally differ: the rolling tag carries latest.json (the "current
          # release" pointer the backend and dashboard read), while the immutable vX.Y.Z release
          # carries only the compiled outputs.
          # Both sides are normalised with LC_ALL=C: plain `sort` collates case-insensitively under
          # some locales, which would make the comparison order-dependent.
          normalise() { LC_ALL=C sort | tr '\n' ' ' | sed 's/[[:space:]]*$//'; }
          normalise_list() { printf '%s\n' "$@" | normalise; }
          check_release() {
            local tag="$1" expected="$2" found
            # Capture explicitly so a failed API call names itself instead of exiting silently
            # through set -e and pipefail.
            if ! found="$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" \
                --json assets --jq '.assets[].name' | normalise)"; then
              echo "Could not read the asset list for $tag. Verify the tag exists and that the workflow token can read releases." >&2
              return 1
            fi
            if [ "$found" != "$expected" ]; then
              echo "Unexpected assets on $tag." >&2
              echo "Expected: $expected" >&2
              echo "Found:    $found" >&2
              return 1
            fi
            echo "$tag exposes exactly: $found"
          }
          check_release "$ROLLING_TAG" \
            "$(normalise_list Phantom-Android.apk Phantom-Windows-x64.zip Phantom-macOS.zip latest.json)"
          check_release "$VERSION_TAG" \
            "$(normalise_list Phantom-Android.apk Phantom-Windows-x64.zip Phantom-macOS.zip)"
          echo "Both releases expose exactly the expected compiled outputs."
